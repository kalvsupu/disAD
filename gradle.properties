org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Android Gradle Plugin refuses project paths containing non-ASCII characters.
# If your checkout path contains them (e.g. a CJK folder name), either move the
# project to an ASCII path, or create a junction/symlink and build through it:
#   Windows:  cmd /c mklink /J C:\dev\disad "D:\<your-folder>"
#   Linux:    ln -s "/path/中文目录" ~/dev/disad
android.overridePathCheck=true

kotlin.code.style=official
